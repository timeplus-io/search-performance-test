# Single-host benchmark. run.sh starts ONE engine at a time so both get the same
# CPU / memory budget (BENCH_CPUS, BENCH_MEM). The `bench` container is the client.
x-limits: &limits
  cpus: "${BENCH_CPUS:-8}"
  mem_limit: "${BENCH_MEM:-16g}"

services:
  timeplus:
    profiles: ["tp"]
    image: timeplus/timeplus-enterprise:${TP_VERSION:-3.4.1}
    <<: *limits
    ports:
      - "8000:8000"   # web console (optional, for looking around)
      - "8463:8463"   # native TCP, used by the bench client
    volumes:
      - tp-data:/timeplus/data
    ulimits:
      nofile: { soft: 262144, hard: 262144 }

  elasticsearch:
    profiles: ["es"]
    image: elasticsearch:${ES_VERSION:-8.19.3}
    <<: *limits
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - cluster.routing.allocation.disk.threshold_enabled=false   # avoid disk-watermark read-only surprises on a test host
      - ES_JAVA_OPTS=-Xms${ES_HEAP:-8g} -Xmx${ES_HEAP:-8g}
    ports:
      - "9200:9200"
    volumes:
      - es-data:/usr/share/elasticsearch/data
    ulimits:
      nofile: { soft: 65536, hard: 65536 }
      memlock: { soft: -1, hard: -1 }
    healthcheck:
      test: ["CMD-SHELL", "curl -fs 'http://localhost:9200/_cluster/health?wait_for_status=yellow&timeout=5s' || exit 1"]
      interval: 10s
      retries: 30

  bench:
    profiles: ["bench"]
    build: ./bench
    environment:
      - TP_HOST=timeplus
      - TP_USER=${TP_USER:-proton}
      - TP_PASSWORD=${TP_PASSWORD:-timeplus@t+}
      - ES_URL=http://elasticsearch:9200
      - TP_SETTINGS=${TP_SETTINGS:-}
    volumes:
      - ./data:/data
      - ./results:/results

volumes:
  tp-data:
  es-data:
